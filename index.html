<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KREATE AI GARAGE · 임태훈</title>
  <meta name="description" content="임태훈(Taehoun Lim)의 개인 홈페이지 · AI Works, KAIST AI 수강과목, DX">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1. 상단 바: 로고, 검색창(꾸밈용), KO/EN 버튼, 장바구니 아이콘 -->
  <header id="top-bar">
    <p>[상단 바] KREATE AI GARAGE · 검색창 · KO/EN · 장바구니(0)</p>
  </header>

  <main>
    <!-- 2. 오늘의 특가 배너 -->
    <section id="banner">
      <h1>[배너] 오늘의 특가 · TODAY'S PICK</h1>
      <p>임태훈 TAEHOUN LIM</p>
    </section>

    <!-- 3. 카테고리 탭 -->
    <nav id="category-tabs">
      <p>[카테고리 탭] 전체 · AI Works · KAIST · DX · 프로필</p>
    </nav>

    <!-- 4. 상품 목록 (3단계에서 js/data.js의 내용으로 채움) -->
    <section id="product-list">
      <h2>[상품 목록]</h2>
    </section>

    <!-- 5. 장바구니 (4단계에서 만듦) -->
    <section id="cart">
      <h2>[장바구니]</h2>
    </section>

    <!-- 6. 주문 완료 → 상세 페이지 (5단계에서 만듦) -->
    <section id="order">
      <h2>[주문 완료 · 상세 페이지]</h2>
    </section>
  </main>

  <!-- 7. 하단 판매자 정보 -->
  <footer id="seller-info">
    <p>[판매자 정보] 판매자 임태훈 · 소재지 서울 · GitHub</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
